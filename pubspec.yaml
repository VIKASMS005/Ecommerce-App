name: shopping_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  intl: ^0.20.2
  http: ^1.6.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.6
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  geocoding: ^3.0.0
  geolocator: ^13.0.0
  sqflite: ^2.4.3
  uuid: ^4.5.1
  location: ^10.0.2
  google_places_flutter: ^2.0.9
  flutter_dotenv: ^5.1.0

flutter_native_splash:
  color: "#FDB913"
  image: assets/images/app_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FDB913"
  adaptive_icon_foreground: "assets/images/app_logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
  
  assets:
    - assets/images/order_success.png
    - assets/images/app_logo.png
    - assets/images/app_logo_512.png
    - .env

        
